[phases.setup]
nixPkgs = [
    "php83",
    "php83Extensions.pdo_sqlite",
    "php83Extensions.sqlite3",
    "php83Extensions.intl",
    "php83Extensions.zip",
    "php83Extensions.dom",
    "php83Extensions.mbstring",
    "php83Extensions.xml",
    "php83Extensions.curl",
    "php83Extensions.fileinfo",
    "php83Extensions.openssl",
    "php83Extensions.tokenizer",
    "sqlite",
    "nodejs_20"
]

[phases.build]
cmds = [
    "composer install --ignore-platform-reqs --optimize-autoloader --no-interaction",
    "npm ci --ignore-scripts",
    "npm run build",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "bash railway-start.sh"
